<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Profile | ThePetGrid</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0d0f12; color: #f3f4f6; }
        .glass-card { background: rgba(18, 22, 28, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="w-full max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-extrabold tracking-tight text-white">
            🐾 The<span class="text-orange-500">PetGrid</span>
        </a>
        <a href="index.html" class="text-sm text-gray-400 hover:text-white transition">Back to Grid</a>
    </header>

    <!-- Profile Header Section -->
    <main class="max-w-6xl w-full mx-auto px-6 py-8 flex-grow">
        <div class="glass-card rounded-3xl p-8 mb-8 flex flex-col md:flex-row items-center gap-6 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 to-amber-500"></div>
            
            <!-- Org Logo -->
            <img id="orgLogo" src="https://unsplash.com" 
                 class="w-32 h-32 rounded-2xl object-cover border-2 border-gray-700 bg-[#161b22]" alt="Organization Logo">
            
            <!-- Org Info -->
            <div class="flex-grow text-center md:text-left">
                <div class="flex flex-col md:flex-row items-center gap-3 mb-2">
                    <h1 id="orgName" class="text-3xl font-extrabold text-white tracking-tight">Loading Organization...</h1>
                    <span id="verifiedBadge" class="hidden bg-blue-500/10 text-blue-400 text-xs px-2.5 py-1 rounded-full font-bold uppercase tracking-wider border border-blue-500/20">
                        ✓ Verified Badge
                    </span>
                </div>
                <p id="orgDescription" class="text-gray-400 max-w-2xl mb-4">Fetching details from the grid network...</p>
                <div class="flex flex-wrap justify-center md:justify-start gap-4 text-sm">
                    <a id="orgWebsite" href="#" target="_blank" class="text-orange-400 hover:underline hidden">🌐 Visit Website</a>
                </div>
            </div>
        </div>

        <!-- Pets Grid Section -->
        <section>
            <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
                🐾 Pets Available for Adoption
            </h2>
            <div id="petsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Dynamic pet cards will be loaded here -->
                <p id="loadingPets" class="text-gray-500 col-span-full text-center py-12">Looking for pets connected to this shelter...</p>
            </div>
        </section>
    </main>

    <footer class="w-full text-center py-6 text-xs text-gray-600 border-t border-gray-900 mt-12">
        &copy; 2026 ThePetGrid. All rights reserved.
    </footer>

    <!-- Scripts -->
    <script src="js/supabase-config.js"></script>
    <script src="js/org-profile.js"></script>
</body>
</html>
