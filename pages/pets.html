<html lang="en">
<head>
<meta charset="utf-8"/>

</head>
<body class="atlas-shell">
<header class="main-header" data-unified-header="true">
  <div class="header-container">
    <a class="logo" href="../index.html" aria-label="ThePetGrid home">
      <span class="logo-icon" aria-hidden="true">🐾</span>
      <span class="logo-wordmark">ThePetGrid</span>
    </a>

    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="pets.html">Pets</a>
      <a href="map.html">Map</a>
      <a href="community.html">Community</a>
      <a href="messages.html">Messages</a>
      <a href="memorials.html">Memorials</a>
    </nav>

    <div class="header-actions">
      <a class="lost-found-btn" href="lost-found.html">
        <span aria-hidden="true">🆘</span>
        <span class="header-action-label">Lost &amp; Found</span>
      </a>
      <a class="login-btn" href="login.html">Log In</a>
    </div>
  </div>
</header>
<main class="browse-page">
<section class="browse-hero">
<div class="browse-hero__content">
<span class="browse-hero__badge">🌍 Discover the global pet community</span>
<h1>Find your next <span>favourite pet</span></h1>
<p>Explore profiles, show some love and connect with pets and owners around the world.</p>
<a class="browse-add-pet" href="upload.html">🐾 Add Your Pet</a>
</div>
</section>
<section aria-label="Browse pets" class="browse-shell">
<div class="browse-toolbar">
<label class="search-control" for="petSearch">
<span aria-hidden="true">⌕</span>
<input autocomplete="off" id="petSearch" placeholder="Search name, breed, owner or place…" type="search"/>
</label>
<label class="select-control">
<span class="sr-only">Sort pets</span>
<select id="petSort">
<option value="newest">Newest first</option>
<option value="liked">Most liked</option>
<option value="followed">Most followed</option>
<option value="az">Name A–Z</option>
</select>
</label>
</div>
<div aria-label="Pet filters" class="filter-row" id="petFilters">
<button class="filter-chip is-active" data-filter="all" type="button">All Pets</button>
<button class="filter-chip" data-filter="Dog" type="button">🐶 Dogs</button>
<button class="filter-chip" data-filter="Cat" type="button">🐱 Cats</button>
<button class="filter-chip" data-filter="Bird" type="button">🐦 Birds</button>
<button class="filter-chip" data-filter="Rabbit" type="button">🐰 Rabbits</button>
<button class="filter-chip" data-filter="other" type="button">🐾 Others</button>
<button class="filter-chip" data-filter="favorites" type="button">⭐ Favorites</button>
</div>
<div class="browse-summary">
<div><strong id="resultCount">0</strong> pets found</div>
<button class="clear-filters" id="clearFilters" type="button">Clear filters</button>
</div>
<section aria-live="polite" class="pets-grid" id="petsGrid"></section>
<nav aria-label="Pet pages" class="pagination" id="pagination"></nav>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../store/pet-store.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pet-likes.js"></script>
<script src="../js/pet-favorites.js"></script>
<script src="../js/pets.js"></script>
<script src="../js/header.js?v=20260812-unified-header"></script>
<script src="../js/header-live.js?v=20260812-unified-header"></script>
<script src="../js/atlas-shell.js"></script>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
