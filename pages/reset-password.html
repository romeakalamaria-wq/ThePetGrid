<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — ThePetGrid</title>
  <link rel="icon" href="../assets/favicon.png">
  <link rel="stylesheet" href="../design/theme.css">
  <link rel="stylesheet" href="../design/style.css">
  <link rel="stylesheet" href="../design/header.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <header class="main-header"><div class="header-container"><a class="logo" href="../index.html"><span class="logo-icon">🐾</span><span>ThePetGrid</span></a><nav class="main-nav" aria-label="Main navigation"><a href="../index.html">Home</a><a href="pets.html">Pets</a><a href="lost-found.html">Lost &amp; Found</a></nav><div class="header-actions"><a class="login-btn" href="login.html">Log In</a></div></div></header>
  <main class="auth-shell">
    <section class="auth-card">
      <span class="auth-reset-icon" aria-hidden="true">🔐</span>
      <h1>Choose a new password</h1>
      <p id="resetIntro">Checking your secure reset link…</p>
      <form id="resetPasswordForm" hidden>
        <label class="field">New password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <label class="field">Confirm new password<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></label>
        <p class="reset-password-strength">Use at least 8 characters.</p>
        <button class="auth-submit" id="resetPasswordSubmit" type="submit">Update Password</button>
      </form>
      <div id="resetMessage" class="auth-message" hidden></div>
      <a class="auth-back-link" href="login.html">← Back to Log In</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
