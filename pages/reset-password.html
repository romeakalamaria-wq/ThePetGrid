<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — ThePetGrid</title>
  <link rel="icon" href="../assets/favicon.png">
  <link rel="stylesheet" href="../design/theme.css">
  <link rel="stylesheet" href="../design/style.css">
  <link rel="stylesheet" href="../design/header.css">
  <link rel="stylesheet" href="../css/login.css">
<link rel="stylesheet" href="../design/header-unified.css?v=20260812-1">
</head>
<body>
  <header class="main-header" data-unified-header="true">
  <div class="header-container">
    <a class="logo" href="../index.html" aria-label="ThePetGrid home">
      <span class="logo-icon" aria-hidden="true">🐾</span>
      <span class="logo-wordmark">ThePetGrid</span>
    </a>

    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="../index.html">Home</a>
      <a href="pets.html">Pets</a>
      <a href="map.html">Map</a>
      <a href="community.html">Community</a>
      <a href="messages.html">Messages</a>
      <a href="memorials.html">Memorials</a>
    </nav>

    <div class="header-actions">
      <a class="lost-found-btn" href="lost-found.html">
        <span aria-hidden="true">🆘</span>
        <span class="header-action-label">Lost &amp; Found</span>
      </a>
      <a class="login-btn" href="login.html">Log In</a>
    </div>
  </div>
</header>
  <main class="auth-shell">
    <section class="auth-card">
      <span class="auth-reset-icon" aria-hidden="true">🔐</span>
      <h1>Choose a new password</h1>
      <p id="resetIntro">Checking your secure reset link…</p>
      <form id="resetPasswordForm" hidden>
        <label class="field">New password<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <label class="field">Confirm new password<input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></label>
        <p class="reset-password-strength">Use at least 8 characters.</p>
        <button class="auth-submit" id="resetPasswordSubmit" type="submit">Update Password</button>
      </form>
      <div id="resetMessage" class="auth-message" hidden></div>
      <a class="auth-back-link" href="login.html">← Back to Log In</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
