<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Organization | ThePetGrid</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link href="design/theme.css" rel="stylesheet"/>
    <link href="design/style.css" rel="stylesheet"/>
    <link href="design/header.css" rel="stylesheet"/>
    <link href="design/atlas-shell.css" rel="stylesheet"/>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #061326; color: #f3f4f6; }
        .glass-card { background: rgba(6, 19, 38, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="atlas-shell min-h-screen flex flex-col justify-between">

    <header class="w-full max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
            🐾 The<span class="text-orange-500">PetGrid</span>
        </a>
        <a href="index.html" class="text-sm text-gray-400 hover:text-white transition">Back to Grid</a>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-lg glass-card rounded-2xl p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 to-amber-500"></div>
            
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Register Professional Profile</h1>
            <p class="text-gray-400 text-sm mb-6">Create your standalone organization profile to feature your shelter, brand, or clinic on the world map.</p>

            <form id="createOrgForm" class="space-y-5">
                <div>
                    <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">Organization Name *</label>
                    <input type="text" id="orgName" required placeholder="e.g., Happy Paws Shelter" 
                           class="w-full bg-[#0a1f38] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition">
                </div>

                <div>
                    <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">About / Mission</label>
                    <textarea id="orgDescription" rows="3" placeholder="Describe your team's mission..." 
                              class="w-full bg-[#0a1f38] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">Website URL</label>
                    <input type="url" id="orgWebsite" placeholder="https://example.com" 
                           class="w-full bg-[#0a1f38] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition">
                </div>

                <div>
                    <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">Logo Image URL</label>
                    <input type="url" id="orgAvatar" placeholder="https://unsplash.com..." 
                           class="w-full bg-[#0a1f38] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition">
                </div>

                <div id="formMsg" class="hidden text-sm p-3 rounded-xl font-semibold"></div>

                <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3.5 rounded-xl transition duration-300 shadow-lg shadow-orange-500/10">
                    Register Profile 🚀
                </button>
            </form>
        </div>
    </main>

    <footer class="w-full text-center py-6 text-xs text-gray-600">
        &copy; 2026 ThePetGrid. All rights reserved.
    </footer>

    <!-- ΣΤΑΘΕΡΟ LIVE LINK ΓΙΑ ΤΟ SUPABASE (CDNJS) -->
    <script src="https://cloudflare.com"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/create-org.js"></script>
</body>
</html>
